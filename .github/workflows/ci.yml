name: CI

# Lightweight checks only: static formatting/syntax checks and Go compilation.
# No cloud credentials, Terraform Cloud token, or real AWS/Datadog resources
# are required or used by this workflow.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  terraform-fmt:
    name: Terraform fmt check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check formatting of all .tf files
        run: terraform fmt -check -recursive -diff

  terraform-validate:
    name: Terraform validate (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only modules that don't source modules from a private Terraform
        # registry can be validated without credentials. modules/aws/ecs-apps
        # and the examples/ configs pull submodules from a private registry
        # and are intentionally excluded here (they still get fmt-checked
        # above).
        module:
          - modules/aws/elasticache
          - modules/aws/kinesis
          - modules/aws/rds
          - modules/datadog/monitor
          - modules/datadog/slo
          - modules/datadog/synthetic_hc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init (no backend, public providers only)
        run: terraform -chdir=${{ matrix.module }} init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=${{ matrix.module }} validate

  go:
    name: Go vet & build
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Compile test files (no execution, no real infra/secrets)
        run: go test -run '^$' ./...
