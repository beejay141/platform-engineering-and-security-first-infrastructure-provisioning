name: Pull request
on:
  pull_request:

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: 
          - aws/ecs_apps
          - aws/elasticache
          - aws/kinesis
          - aws/rds
          - datadog/monitor
          - datadog/slo
          - datadog/synthetic_hc
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: "0"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.3.4
          cli_config_credentials_token: ${{ secrets.TERRAFORM_CLOUD_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-west-2"

      - uses: actions/setup-go@v3
        with:
          go-version: ">=1.17.0"

      - name: Setup Golang caches
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-golang-${{ matrix.module }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golang-

      - name: Run Validation
        run: ./scripts/validate.sh
        continue-on-error: false

      - name: Run Go tests
        shell: bash
        env:
          TF_VAR_DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          TF_VAR_DD_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
        run: |
          if [[ -z $(git diff --name-only $(git rev-parse origin/main) HEAD | grep ${{ matrix.module }}) ]];
          then
            echo "No changes to test files, skipping...";
            exit 0;
          fi
          go test -v tests/${{ matrix.module }}_test.go -timeout 30m
