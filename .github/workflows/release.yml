name: Release
concurrency: release
on:
  push:
    branches: [main]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PUSH_TOKEN }}

      - id: semantic-release
        name: Create tag and push
        uses: cycjimmy/semantic-release-action@v3.1.2
        with:
          semantic_version: 19.0.5
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}

      - name: Get major versions
        id: major-versions
        env:
          NEW_VER: ${{ steps.semantic-release.outputs.new_release_version }}
          OLD_VER: ${{ steps.semantic-release.outputs.last_release_version }}
        run: |
          REGEX_GET_MAJOR='s/^([0-9]+)\.[0-9]+\.[0-9]+$/\1/g'
          OLD_MAJOR_VER="$(echo $OLD_VER | sed -r "$REGEX_GET_MAJOR")"
          NEW_MAJOR_VER="$(echo $NEW_VER | sed -r "$REGEX_GET_MAJOR")"
          if [ "$OLD_MAJOR_VER" = "$NEW_MAJOR_VER" ]; then
            OLD_NEW_EQUAL=true
          else
            OLD_NEW_EQUAL=false
          fi

          echo "old_new_equal=$OLD_NEW_EQUAL" >> $GITHUB_OUTPUT
          echo "old=$OLD_MAJOR_VER" >> $GITHUB_OUTPUT

      - name: Create the old version branch
        if: steps.major-versions.outputs.old_new_equal == 'false'
        env:
          OLD_MAJOR_VER: "v${{ steps.major-versions.outputs.old }}"
          OLD_VER: "v${{ steps.semantic-release.outputs.last_release_version }}"
        run: |
          git checkout -b "${OLD_MAJOR_VER}" "${OLD_VER}"
          git push origin "${OLD_MAJOR_VER}"
